# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:

    runs-on: macos-26

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Install SwiftLint
      run: |
        brew update
        brew install swiftlint
        swiftlint version
    - name: Lint Swift
      run: swiftlint lint --strict
    - name: Build app
      run: xcodebuild -project Synth.xcodeproj -scheme Synth -configuration Debug build CODE_SIGNING_ALLOWED=NO
    - name: Test app
      run: xcodebuild -project Synth.xcodeproj -scheme Synth -configuration Debug test CODE_SIGNING_ALLOWED=NO

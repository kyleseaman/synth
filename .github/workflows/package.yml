name: Package App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Install signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Add to search list so xcodebuild finds it
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Set version
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          VERSION="1.0.0-preview+${SHORT_SHA}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" SynthApp/Info.plist
          plutil -replace CFBundleVersion -string "$SHORT_SHA" SynthApp/Info.plist

      - name: Build MCP server
        run: cd synth-mcp-server && swift build -c release

      - name: Archive app
        run: |
          xcodebuild archive \
            -project Synth.xcodeproj \
            -scheme Synth \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Synth.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application"

      - name: Export app bundle
        run: |
          mkdir -p $RUNNER_TEMP/export
          cp -R $RUNNER_TEMP/Synth.xcarchive/Products/Applications/Synth.app $RUNNER_TEMP/export/
          cp synth-mcp-server/.build/release/synth-mcp-server $RUNNER_TEMP/export/Synth.app/Contents/MacOS/

          # Re-sign after adding the MCP binary
          codesign --force --deep --sign "Developer ID Application" \
            --timestamp $RUNNER_TEMP/export/Synth.app

          cd $RUNNER_TEMP/export
          zip -r -y Synth.zip Synth.app

      - name: Notarize app
        if: env.NOTARY_APPLE_ID != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit $RUNNER_TEMP/export/Synth.zip \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the notarization ticket to the app
          xcrun stapler staple $RUNNER_TEMP/export/Synth.app

          # Re-zip with stapled app
          cd $RUNNER_TEMP/export
          rm Synth.zip
          zip -r -y Synth.zip Synth.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synth-1.0.0-preview-${{ github.sha }}
          path: ${{ runner.temp }}/export/Synth.zip
          retention-days: 30

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          TAG="v1.0.0-preview+${SHORT_SHA}"
          gh release create "$TAG" \
            $RUNNER_TEMP/export/Synth.zip \
            --title "Synth 1.0.0-preview (${SHORT_SHA})" \
            --notes "Built from commit ${GITHUB_SHA}" \
            --prerelease

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db || true
